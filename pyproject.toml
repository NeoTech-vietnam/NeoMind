[project]
name = "langflow"
version = "0.1.0"
description = "Fixed, gated workflows for coding agents (Claude Code, Codex) on LangGraph, for any project"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "jsonschema==4.25.1",
    "textual==8.2.8",
]

[project.scripts]
langflow = "langflow.cli:main"
langflow-guard = "langflow.guard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langflow"]
artifacts = ["src/langflow/webui/**"]   # the built web app (ui/ -> npm run build), also when git ignores it
