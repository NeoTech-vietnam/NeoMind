name: WorkForce release candidate

# Builds reviewable assets only. Actual installed-client acceptance and explicit
# publication happen after these core/package checks; no release is created here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Native candidate on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Prepare pinned engine bootstrap
        run: npm run engine:bootstrap
      - name: Core regression
        run: npm test
      - name: Build native runtime, VSIX and candidate checksums
        run: npm run release:artifacts
      - name: Verify the extracted portable asset without installing dependencies
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/package-smoke.mjs --runtime-archive "artifacts/workforce-v${version}/workforce-runtime-${version}-${{ matrix.target }}.tgz" --report "artifacts/workforce-v${version}/package-smoke-${{ matrix.target }}.json"
      - name: Include validation reports in candidate checksums
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node --input-type=module -e "import { writeReleaseIndex } from './scripts/package-release.mjs'; await writeReleaseIndex(process.argv[1]);" "artifacts/workforce-v${version}"
      - name: Retain candidate assets and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workforce-candidate-${{ matrix.target }}-${{ github.run_id }}
          path: artifacts/workforce-v*/
          if-no-files-found: warn
          retention-days: 14
