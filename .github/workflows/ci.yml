name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare pinned offline engine bootstrap
        run: npm run engine:bootstrap
      - name: Build and test
        # Keep the full suite while bounding simultaneous native guardians and
        # ACL subprocesses. Build failure must prevent test execution.
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run --json
      - name: Build local package
        run: npm pack
      - name: Verify installed package lifecycle and MCP
        run: npm run package:smoke
      # Reuse the successful Windows/Ubuntu regression matrix. This branch can
      # produce reviewable assets before its manual workflow reaches main.
      - name: Build native WorkForce candidate assets
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/workforce-vmodel'
        run: npm run release:artifacts
      - name: Verify the extracted native WorkForce candidate
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/workforce-vmodel'
        shell: bash
        env:
          WORKFORCE_NATIVE_TARGET: ${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x64' }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/package-smoke.mjs --runtime-archive "artifacts/workforce-v${version}/workforce-runtime-${version}-${WORKFORCE_NATIVE_TARGET}.tgz" --report "artifacts/workforce-v${version}/package-smoke-${WORKFORCE_NATIVE_TARGET}.json"
      - name: Index native WorkForce validation reports
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/workforce-vmodel'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node --input-type=module -e "import { writeReleaseIndex } from './scripts/package-release.mjs'; await writeReleaseIndex(process.argv[1]);" "artifacts/workforce-v${version}"
      - name: Retain native WorkForce candidate assets and validation reports
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/workforce-vmodel'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workforce-candidate-${{ runner.os }}-${{ github.run_id }}
          path: artifacts/workforce-v*/
          if-no-files-found: warn
          retention-days: 14
